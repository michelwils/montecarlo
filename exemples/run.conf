# Example configuration file for `python monte_carlo.py @exemples/run.conf`.
#
# One flag per line — "-flag value" or "--long-flag value" — using the
# same names as `python monte_carlo.py --help`. Blank lines and lines
# starting with '#' are ignored. Values with spaces need quotes, just
# like on a command line (e.g. -D "My subtitle") — this includes a
# file path if it lives under a folder with spaces in its name (e.g.
# a OneDrive path: -f "C:\OneDrive - Company\data\kanban_zone.csv").
# Backslashes in paths are kept as-is, unlike on a real command line.
#
# Combine with extra flags on the command line to override just those
# for one run, e.g.:
#   python monte_carlo.py @exemples/run.conf -w 4
#
# Copy this file to data/run.conf (gitignored) and adjust it for your
# own team — that's the file you'll keep reusing, editing only the
# scope (-t/-s/-m/-l/-x/-p) and --target-date as the plan evolves.
# The data file, item mix, and target date below are illustrative.
# Every option is listed below; uncomment the ones you need.

# Source: use a local CSV/TXT file OR --board, never both.
--file exemples/kanban_zone.csv
# --board YOUR_BOARD_PUBLIC_ID

# API options: uncomment only when using --board.
# Prefer the KANBAN_ZONE_API_KEY environment variable for your real key.
# --api-key YOUR_API_KEY
# --include-archived
# Cached cards are reused for 15 minutes; 0 disables the cache.
# --cache-ttl 15
# --refresh
# --cache-dir .cache/kanbanzone
# --include-todo
# --include-wip
# --include-backlog

# Card filters: match any listed owner; exclusions take precedence.
# --owners "Alice Smith" "Bob Jones"
# --xowners "Bob Jones"
# Also count unowned cards in a board-derived target (they always count in history).
# --include-unowned

# Optional fixed points per card instead of the source's size field.
# --uniform-size 1

# Scope: what's left to deliver (added to any board-derived target)
--tiny 0
--small 0
--medium 5
--large 2
--xlarge 0
--points 0

--weeks 10
# Delivery deadline — recomputed to "weeks remaining" automatically
# every time you run this, no need to edit it as the date approaches.
# Use it instead of --weeks: whichever of the two comes last wins.
# --target-date 2026-12-15
# Omit --start-date to start next Monday.
# --start-date 2026-11-09
--days-off 0
--unplanned-ratio 0

# History: omit window settings for all available history.
# Use --window OR date bounds, never both.
# --window 12
# --window-start 2026-01-01
# --window-end 2026-10-31
# Every week touched by these inclusive ranges is excluded.
# --exclude-periods 2026-07-20:2026-08-02 2026-09-07:2026-09-13

# Simulation and report settings.
--simulations 10000
--certainties 80 90
--chart-weeks 26
--lang en
# --title "Delivery forecast"
# --description "Team delivery forecast"
# --annotations exemples/annotations.csv

# Output settings.
--output-dir output
--output-prefix monte_carlo
# --filename-format "{prefix}_{date}_{target:.0f}_{timestamp:%Y%m%d_%H%M%S}"

# Special commands, normally used separately rather than uncommented here.
# --configs data/team_a.conf data/team_b.conf
# --formats
# --help

# Personal configuration: data/run.conf (ignored by Git).
# Shared template: exemples/run.conf.
# Run from the repository root: python monte_carlo.py @data/run.conf
# Both files start with identical content; customize only your local copy.
# One option per line. Lines starting with # are ignored.
# Quote values containing spaces. Do not put comments after option values.
# Additional command-line options override matching settings in this file.

# Source: use a local CSV/TXT file OR --board, never both.
--file exemples/kanban_zone.csv
# --board YOUR_BOARD_PUBLIC_ID

# API options: uncomment only when using --board.
# Prefer the KANBAN_ZONE_API_KEY environment variable for your real key.
# --api-key YOUR_API_KEY
# --include-archived
# Cached cards are reused for 15 minutes; 0 disables the cache.
# --cache-ttl 15
# --refresh
# --cache-dir .cache/kanbanzone
# --include-todo
# --include-wip
# --include-backlog

# Card filters: match any listed owner; exclusions take precedence.
# --owners "Alice Smith" "Bob Jones"
# --xowners "Bob Jones"

# Optional fixed points per card instead of the source's size field.
# --uniform-size 1

# Manual target, added to any board-derived target.
--tiny 0
--small 0
--medium 5
--large 2
--xlarge 0
--points 0

# Duration: use --weeks OR --target-date, never both.
--weeks 10
# --target-date 2026-12-15
# Omit --start-date to start next Monday.
# --start-date 2026-11-09
--days-off 0
--unplanned-ratio 0

# History: omit window settings for all available history.
# Use --window OR date bounds, never both.
# --window 12
# --window-start 2026-01-01
# --window-end 2026-10-31
# Every week touched by these inclusive ranges is excluded.
# --exclude-periods 2026-07-20:2026-08-02 2026-09-07:2026-09-13

# Simulation and report settings.
--simulations 10000
--certainties 80 90
--chart-weeks 26
--lang en
# --title "Delivery forecast"
# --description "Team delivery forecast"
# --annotations exemples/annotations.csv

# Output settings.
--output-dir output
--output-prefix monte_carlo
# --filename-format "{prefix}_{date}_{target:.0f}_{timestamp:%Y%m%d_%H%M%S}"

# Special commands, normally used separately rather than uncommented here.
# --configs data/team_a.conf data/team_b.conf
# --formats
# --help
